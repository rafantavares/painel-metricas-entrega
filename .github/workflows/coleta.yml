name: Coleta agendada

# Roda o coletor e publica o banco na branch `dados`, de onde o dashboard publicado
# baixa os dados (ver docs/adr/0006-atualizacao-e-publicacao.md).
on:
  schedule:
    - cron: "17 */6 * * *" # a cada 6 horas, no minuto 17 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

env:
  PAINEL_BANCO: data/painel.duckdb
  # Configuráveis em Settings → Secrets and variables → Actions → Variables.
  PAINEL_REPOSITORIOS: ${{ vars.PAINEL_REPOSITORIOS || github.repository }}
  PAINEL_REGRAS_DEPLOY: ${{ vars.PAINEL_REGRAS_DEPLOY || format('{0}=workflow:ci.yml@main', github.repository) }}

jobs:
  coletar:
    name: Coletar e publicar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar o pacote
        run: pip install -e .

      - name: Recuperar o banco da última coleta
        run: |
          mkdir -p "$(dirname "$PAINEL_BANCO")"
          if git fetch --depth=1 origin dados; then
            git show FETCH_HEAD:painel.duckdb > "$PAINEL_BANCO"
          else
            echo "A branch dados ainda não existe: esta será a primeira coleta completa."
          fi

      - name: Coletar
        env:
          # Um token pessoal (secret PAINEL_GITHUB_TOKEN) só é necessário para ler
          # repositórios privados de outros donos; o token do workflow basta para os públicos.
          GITHUB_TOKEN: ${{ secrets.PAINEL_GITHUB_TOKEN || github.token }}
        run: python -m painel.coletar

      - name: Publicar na branch dados
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          publicar="$(mktemp -d)"
          cp "$PAINEL_BANCO" "$publicar/painel.duckdb"
          cd "$publicar"
          git init -q -b dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add painel.duckdb
          git commit -q -m "dados: coleta de $(date -u '+%d/%m/%Y %H:%M') UTC"
          # Força o push: a branch guarda só a versão mais recente, sem acumular histórico.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dados
